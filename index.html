أغلق الباب خلفهم من تلقاء نفسه.`},{t:'رسائل المطر',c:'حب',x:`كل يوم ممطر كانت ليلى تجد ورقة صغيرة تحت مظلتها عند محطة الباص، مكتوب فيها جملة دافئة بخط جميل.

ضحكت ليلى، وللمرة الأولى تمنت ألا يتوقف المطر.`},{t:'قلبان وقدر',c:'حب',x:`التقى آدم ومريم في مكتبة صغيرة، مدّا يديهما معاً إلى الكتاب الأخير على الرف.

function tosView(){$('nv').innerHTML='';$('v').innerHTML=`<div class=card><h3>قبل ما تكمل</h3><p>حدّثنا شروط الاستخدام وسياسة الخصوصية. اقرأهم ووافق للمتابعة.</p><p><a href="terms.html" target=_blank>شروط الاستخدام</a><br><a href="privacy.html" target=_blank>سياسة الخصوصية</a></p><label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.7"><input id=tos_c type=checkbox style="flex:none;width:20px;height:20px"><span>أوافق على الشروط والسياسة، وعمري 13 سنة أو أكثر.</span></label><div class=row><button onclick="tosAccept()">موافق ومتابعة</button><button class=g onclick="logout()">تسجيل الخروج</button></div><div id=tos_m class=mu style="margin-top:8px"></div></div>`}

function authView(){$('v').innerHTML=`<div class=card><h3>${am==='in'?'تسجيل الدخول':'إنشاء حساب جديد'}</h3>${am==='up'?`<input id=au_n placeholder="الاسم" style="width:100%;margin-bottom:8px"><input id=au_u placeholder="username (إنجليزي)" dir=ltr style="width:100%;margin-bottom:8px">`:''}<input id=au_e type=email dir=ltr placeholder="البريد الإلكتروني" style="width:100%;margin-bottom:8px"><input id=au_p type=password dir=ltr placeholder="كلمة السر (6 أحرف على الأقل)" style="width:100%">${am==='up'?`<label style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:13px;line-height:1.7"><input id=au_c type=checkbox style="flex:none;width:20px;height:20px;margin-top:2px"><span>أوافق على <a href="terms.html" target=_blank>شروط الاستخدام</a> و<a href="privacy.html" target=_blank>سياسة الخصوصية</a>، وعمري 13 سنة أو أكثر.</span></label>`:''}<div class=row><button onclick="doAuth()">${am==='in'?'دخول':'تسجيل'}</button><button class=g onclick="am=am==='in'?'up':'in';render()">${am==='in'?'حساب جديد':'عندي حساب'}</button></div><div id=au_m class=mu style="margin-top:8px"></div><div class=mu style="margin-top:10px;font-size:12px"><a href="terms.html" target=_blank>الشروط</a> · <a href="privacy.html" target=_blank>الخصوصية</a></div></div>`;$('nv').innerHTML=''}
async function doAuth(){const e=val('au_e'),p=$('au_p').value,m=$('au_m');m.textContent='...';
if(am==='up'){if(!$('au_c').checked){m.textContent='يجب الموافقة على الشروط وسياسة الخصوصية';return}try{localStorage.setItem('nv_tos1','1')}catch(e){}const u=val('au_u').toLowerCase().replace(/[^a-z0-9_]/g,'');if(u.length<3){m.textContent='اسم المستخدم 3 أحرف إنجليزية على الأقل';return}
const r=await sb.auth.signUp({email:e,password:p,options:{data:{username:u,name:val('au_n')}}});if(r.error){m.textContent=r.error.message;return}
if(!r.data.session){m.textContent='تم! افتح بريدك لتفعيل الحساب ثم سجّل الدخول';am='in';return}await onAuth(r.data.session)}
else{const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error){m.textContent=r.error.message;return}await onAuth(r.data.session)}}
async function loadProf(){const r=await sb.from('profiles').select('*').eq('id',me.id).single();prof=r.data;if(prof){S.user=prof.display_name||prof.username;S.prof.un=prof.username;S.prof.bio=prof.bio||'';S.prof.av=prof.avatar||'🦁';S.pv={priv:+prof.is_private,msg:prof.msg_policy,online:+prof.show_online,fl:+prof.show_following}}}
async function loadPosts(){const r=await sb.from('posts').select('*,profiles(username,display_name,avatar)').order('created_at',{ascending:false}).limit(50);C.posts=r.data||[]}
async function loadUsers(){const r=await sb.from('profiles').select('id,username,display_name,avatar,bio,is_private').neq('id',me.id).eq('is_banned',false).order('created_at',{ascending:false}).limit(30);C.users=r.data||[];const f=await sb.from('follows').select('following_id').eq('follower_id',me.id);C.fol=new Set((f.data||[]).map(x=>x.following_id))}
async function loadConvs(){const r=await sb.from('conversation_members').select('conversations(id,name,is_group)').eq('user_id',me.id);C.convs=(r.data||[]).map(x=>x.conversations).filter(Boolean);for(const c of C.convs){if(!c.is_group){const o=await sb.from('conversation_members').select('profiles(display_name,username)').eq('conversation_id',c.id).neq('user_id',me.id).limit(1);const p=o.data&&o.data[0]&&o.data[0].profiles;c.name=p?(p.display_name||p.username):'محادثة'}}}
async function onAuth(s){me=s?s.user:null;if(me){await loadProf();if(!prof||prof.is_banned){const b=prof&&prof.is_banned;await sb.auth.signOut();me=null;prof=null;toast(b?'هذا الحساب محظور':'تعذر تحميل الحساب')}else await Promise.all([loadPosts(),loadUsers(),loadConvs()])}render()}
async function logout(){unsub();await sb.auth.signOut();me=null;prof=null;C.cur=null;S.user='';closeD();render()}
function cHome(){let h=`<div class=card><textarea id=pt placeholder="اكتب اقتباساً أو فكرة…"></textarea><div class=row><input id=pf type=file accept="image/*,video/*"><button onclick="cPost()">نشر</button></div></div>`;
h+=C.posts.length?C.posts.map(p=>`<div class=card><div class=pp style="border:0;padding:0 0 6px"><div class=av style="width:38px;height:38px;font-size:18px">${p.profiles?esc(p.profiles.avatar||'👤'):'👤'}</div><b>${U(p.profiles)}</b></div><p>${esc(p.body||'')}</p>${p.media_url?(p.media_type==='video'?`<video src="${esc(p.media_url)}" controls playsinline></video>`:`<img src="${esc(p.media_url)}">`):''}<div class=row><button class=g onclick="share(C.posts.find(x=>x.id==='${p.id}').body)">↗️</button>${p.user_id===me.id||prof.is_admin?`<button class=g onclick="cDel('${p.id}')">🗑️</button>`:''}<button class=g onclick="cRep('${p.id}')">🚩</button></div></div>`).join(''):'<p class=mu>لا منشورات بعد، كن أول من ينشر.</p>';return h}
async function cPost(){const t=val('pt'),f=$('pf').files[0];if(!t&&!f)return;let url=null,ty=null;
if(f){const path=me.id+'/'+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'');const u=await sb.storage.from('media').upload(path,f);if(u.error){toast(u.error.message);return}url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;ty=f.type.startsWith('video')?'video':'image'}
const r=await sb.from('posts').insert({user_id:me.id,body:t,media_url:url,media_type:ty});if(r.error){toast(r.error.message);return}await loadPosts();render()}
async function cDel(id){await sb.from('posts').delete().eq('id',id);await loadPosts();render()}
async function cRep(id){await sb.from('reports').insert({reporter_id:me.id,target_type:'post',target_id:id,reason:'user report'});toast('تم إرسال البلاغ 🚩')}
function cChat(){if(!C.cur)return `<div class=card><b>محادثاتك</b><div class=mu>لبدء محادثة: ☰ ثم الأشخاص ثم 💬</div></div>`+(C.convs.map(c=>`<div class=card onclick="openC('${c.id}')" style="cursor:pointer"><b>${c.is_group?'👥':'👤'} ${esc(c.name||'محادثة')}</b></div>`).join('')||'');
const c=C.convs.find(x=>x.id===C.cur);return `<div class=row style="margin:0 0 10px"><button class=g onclick="C.cur=null;unsub();render()">→ رجوع</button><b>${esc(c?c.name:'')}</b></div><div class=card>${C.msgs.map(m=>`<div class="msg ${m.sender_id===me.id?'me':''}">${esc(m.body)}</div>`).join('')||'<span class=mu>لا رسائل بعد</span>'}</div><div class=row><input id=mi placeholder="اكتب رسالة…"><button onclick="cSend()">إرسال</button></div>`}
function unsub(){if(ch){sb.removeChannel(ch);ch=null}}
async function openC(id){C.cur=id;const r=await sb.from('messages').select('*').eq('conversation_id',id).order('created_at').limit(200);C.msgs=r.data||[];unsub();ch=sb.channel('m'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},pl=>{if(!C.msgs.some(m=>m.id===pl.new.id)){C.msgs.push(pl.new);if(tab==='chat')render()}}).subscribe();render()}
async function cSend(){const t=val('mi');if(!t)return;const r=await sb.from('messages').insert({conversation_id:C.cur,sender_id:me.id,body:t}).select().single();if(r.error){toast(r.error.message);return}if(!C.msgs.some(m=>m.id===r.data.id))C.msgs.push(r.data);render()}
TABS[0][3]=cHome;TABS[1][3]=cChat;
async function cSearch(){const q=val('pq').replace(/[%_@]/g,'');let r=sb.from('profiles').select('id,username,display_name,avatar,bio,is_private').neq('id',me.id).eq('is_banned',false).limit(30);if(q)r=r.ilike('username','%'+q+'%');const d=await r;C.users=d.data||[];drawer()}
async function cFol(id){if(C.fol.has(id)){await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',id);C.fol.delete(id)}else{const u=C.users.find(x=>x.id===id);const r=await sb.from('follows').insert({follower_id:me.id,following_id:id,status:u&&u.is_private?'pending':'accepted'});if(r.error){toast(r.error.message);return}C.fol.add(id)}drawer()}
async function cMsg(id){const r=await sb.rpc('start_chat',{other:id});if(r.error){toast(r.error.message==='messages closed'?'هذا المستخدم لا يستقبل رسائل منك':r.error.message);return}await loadConvs();closeD();go('chat');await openC(r.data)}
async function cBlk(id){await sb.from('blocks').insert({blocker_id:me.id,blocked_id:id});C.users=C.users.filter(u=>u.id!==id);C.fol.delete(id);drawer()}
const prow2=u=>`<div class=pp><div class=av>${esc(u.avatar||'👤')}</div><div style="flex:1;min-width:0"><b>${U(u)}</b> <span class=mu>@${esc(u.username)}</span><div class=mu>${esc(u.bio||'')}</div></div><div style="display:flex;flex-direction:column;gap:4px"><button class="${C.fol.has(u.id)?'g':''}" onclick="cFol('${u.id}')">${C.fol.has(u.id)?'تتابعه ✓':'متابعة'}</button><div style="display:flex;gap:4px"><button class=g onclick="cMsg('${u.id}')">💬</button><button class=g onclick="cBlk('${u.id}')">🚫</button></div></div></div>`;
async function admLoad(){const s=await sb.rpc('admin_stats');C.stats=s.data;const u=await sb.from('profiles').select('id,username,display_name,is_banned,is_admin').order('created_at',{ascending:false}).limit(50);C.adm=u.data||[];const r=await sb.from('reports').select('*').order('created_at',{ascending:false}).limit(20);C.rep=r.data||[]}
const admHtml=()=>{const s=C.stats||{};return `<div class=card><b>إحصائيات</b><div class=row style="justify-content:space-around;text-align:center">${[['users','مستخدمون'],['new_today','جدد اليوم'],['posts','منشورات'],['messages','رسائل'],['banned','محظورون'],['reports','بلاغات']].map(k=>`<div style="min-width:30%"><b>${s[k[0]]??'-'}</b><div class=mu>${k[1]}</div></div>`).join('')}</div></div><div class=card><b>المستخدمون</b>${C.adm.map(u=>`<div class=pp><div style="flex:1"><b>${esc(u.display_name||u.username)}</b> <span class=mu>@${esc(u.username)}</span></div>${u.is_admin?'<span class=tag>مدير</span>':`<button class="${u.is_banned?'':'g'}" onclick="cBan('${u.id}',${!u.is_banned})">${u.is_banned?'إلغاء الحظر':'حظر'}</button>`}</div>`).join('')}</div><div class=card><b>البلاغات</b>${C.rep.map(r=>`<div class=pp><span class=mu style="flex:1">${esc(r.target_type)}: ${esc(r.target_id.slice(0,8))}</span><button class=g onclick="cRmPost('${r.target_id}')">حذف المحتوى</button></div>`).join('')||'<span class=mu>لا بلاغات</span>'}</div>`};
async function cBan(id,b){await sb.from('profiles').update({is_banned:b}).eq('id',id);await admLoad();drawer()}
async function cRmPost(id){await sb.from('posts').delete().eq('id',id);await admLoad();await loadPosts();drawer()}
const _dr=drawer;
function body(h){const c=$('dr').querySelector('.chips');while(c.nextSibling)c.nextSibling.remove();c.insertAdjacentHTML('afterend',h)}
drawer=function(){_dr();const d=$('dr');
if(ds==='ppl')body(`<div class=card><div class=row style="margin:0"><input id=pq placeholder="ابحث بـ username" dir=ltr><button onclick="cSearch()">بحث</button></div></div><div class=card>${C.users.map(prow2).join('')||'<span class=mu>لا نتائج</span>'}</div>`);
else if(ds==='adm'){body(admHtml());if(!C.al){C.al=1;admLoad().then(()=>drawer())}}
else if(ds==='set')d.insertAdjacentHTML('beforeend','<div class=card><a href="privacy.html" target=_blank>سياسة الخصوصية</a><br><a href="terms.html" target=_blank>شروط الاستخدام</a></div><div class=card><button class=g onclick="logout()">🚪 تسجيل الخروج</button></div>');
if(prof&&prof.is_admin&&ds!=='adm')d.insertAdjacentHTML('beforeend','<div class=card><button onclick="C.al=0;dsw(\'adm\')">🛠️ لوحة التحكم</button></div>')};
const _sm=saveMe;saveMe=async function(){const un=val('pu').toLowerCase().replace(/[^a-z0-9_]/g,'');const r=await sb.from('profiles').update({display_name:val('pn'),bio:val('pb'),...(un.length>=3?{username:un}:{})}).eq('id',me.id);if(r.error){toast(r.error.message);return}_sm();await loadProf()};
const _sa=setAv;setAv=function(a){_sa(a);sb.from('profiles').update({avatar:a}).eq('id',me.id)};
const _ch=chg;chg=function(o,k,v){_ch(o,k,v);if(o==='pv'){const m={priv:'is_private',online:'show_online',fl:'show_following',msg:'msg_policy'}[k];if(m)sb.from('profiles').update({[m]:k==='msg'?v:!!v}).eq('id',me.id)}};
(async()=>{try{const r=await sb.auth.getSession();booting=false;await onAuth(r.data.session)}catch(e){booting=false;render()}})();

</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})</script></body></html>
